<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIDEON Library</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="brand">VIDEON <span id="panel-version" class="panel-version">v0.1.15</span></div>
        <button type="button" id="settings-toggle" class="ghost">Einstellungen</button>
      </header>
      <p id="boot-status" class="status">Panel wird geladen…</p>

      <section id="settings-panel" class="settings hidden">
        <label>
          Product Base URL
          <input id="product-base-url" type="url" placeholder="https://videon.projects-a.plygrnd.tech" />
        </label>
        <label>
          API Token
          <input id="api-token" type="password" placeholder="videon_…" autocomplete="off" />
        </label>
        <label>
          Collection
          <select id="collection-select">
            <option value="">— alle zugänglichen —</option>
          </select>
        </label>
        <label>
          Collection-ID (Fallback)
          <input id="default-project-id" type="text" placeholder="uuid" />
        </label>
        <label id="premiere-bin-label">
          Premiere Bin
          <input id="bin-name" type="text" value="VIDEON" />
        </label>
        <label id="ae-comp-label" class="host-ae hidden">
          After Effects Comp
          <input id="comp-name" type="text" value="VIDEON" />
        </label>
        <div class="cache-box">
          <div class="cache-meta">
            <strong>Lokaler Media-Cache</strong>
            <span id="cache-stats">—</span>
          </div>
          <div class="row">
            <button type="button" id="cache-refresh" class="ghost">Aktualisieren</button>
            <button type="button" id="cache-clear" class="ghost">Cache leeren</button>
          </div>
        </div>
        <div class="row">
          <button type="button" id="settings-save" class="primary">Speichern</button>
          <button type="button" id="test-connection" class="ghost">Verbindung testen</button>
          <button type="button" id="reload-collections" class="ghost">Collections laden</button>
        </div>
        <p id="settings-status" class="status" hidden></p>
      </section>

      <section class="workspace-bar">
        <label>
          Aktive Collection
          <select id="collection-select-main">
            <option value="">— alle zugänglichen —</option>
          </select>
        </label>
      </section>

      <section class="search">
        <input id="search-input" type="search" placeholder="Szenen suchen…" />
        <button type="button" id="search-btn" class="primary">Suchen</button>
      </section>

      <p id="banner" class="banner" hidden></p>

      <section class="results">
        <div class="results-meta">
          <strong>Treffer</strong>
          <div class="results-meta-actions">
            <button type="button" id="select-all-btn" class="ghost tiny" hidden>Alle</button>
            <button type="button" id="select-none-btn" class="ghost tiny" hidden>Keine</button>
            <span id="results-count">0</span>
          </div>
        </div>
        <div id="results-list" class="results-list">
          <p class="empty">Token setzen, Collection wählen, dann suchen.</p>
        </div>
      </section>

      <section id="insert-bar" class="insert-bar hidden">
        <p id="host-badge" class="host-badge" hidden></p>
        <label id="premiere-insert-opts" class="check">
          <input id="append-sequence" type="checkbox" />
          Auch auf aktive Sequence (wenn Host-API erlaubt)
        </label>
        <div id="ae-insert-opts" class="host-ae hidden">
          <label class="check">
            <input id="ae-sequential" type="checkbox" checked />
            Sequenziell platzieren
          </label>
          <label>
            Gap (Frames)
            <input id="ae-gap-frames" type="number" min="0" step="1" value="0" />
          </label>
        </div>
        <div class="row">
          <button type="button" id="dry-run-btn" class="ghost">
            Download prüfen
          </button>
          <button type="button" id="insert-btn" class="primary">
            Einfügen (<span id="selected-count">0</span>)
          </button>
        </div>
        <div id="progress" class="progress hidden">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </section>
    </div>
    <script src="src/panel.bundle.js"></script>
  </body>
</html>
